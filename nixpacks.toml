[phases.setup]
nixPkgs = ["nodejs-20_x"]

[phases.install]
cmds = [
  "npm ci",
  "npm run build --workspace=@swipick/common",
  "npm run build --workspace=@swipick/gaming-services"
]

[phases.build]
cmds = ["echo 'Clean rebuild forced by nixpacks'"]

[start]
cmd = "cd apps/backend/gaming-services && node dist/main.js"
