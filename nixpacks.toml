# Pin a single Node 20 toolchain for Railway/Nixpacks builds.
#
# Why: Railway's nix-npm-overlay was pulling a SECOND Node version into the Nix
# environment (22.19.0 vs 24.10.0), failing the build with a buildEnv path
# conflict. The trigger was Corepack detection from the now-removed
# `packageManager` field — but it kept failing on stale build cache. The mere
# presence of this file forces a fresh build plan (busting that stale cache),
# and pinning nodejs_20 here makes the toolchain explicit and single.
#
# Native build tools (python3/gcc/gnumake) are included so backend services that
# build from the repo root and have native deps (e.g. bff's bcrypt) can still
# compile if no prebuilt binary matches. Harmless for gaming-services.
# frontend-service has its own Root Directory and is unaffected by this file.

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]
